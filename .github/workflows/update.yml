name: Update basket calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test
        run: PYTHONPATH=src pytest -q
      - name: Generate site
        env:
          SPORTADMIN_CALENDAR_URL: ${{ secrets.SPORTADMIN_CALENDAR_URL }}
          PROFIXIO_CALENDAR_URL: ${{ secrets.PROFIXIO_CALENDAR_URL }}
          MIN_PROFIXIO_MATCHES: "5"
        run: PYTHONPATH=src python -m basket_calendar.cli build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
